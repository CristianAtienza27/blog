<header class="header">
  <a class="header__wordmark" routerLink="/">Cristian <em>Atienza</em></a>

  <nav class="header__nav" aria-label="Secciones">
    <ul role="list">
      @for (section of sections; track section.id) {
        <li [attr.data-section]="section.id">
          <a
            [routerLink]="section.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            >{{ section.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <button
    type="button"
    class="header__menu"
    aria-haspopup="dialog"
    aria-controls="site-menu"
    [attr.aria-expanded]="menu.isOpen()"
    (click)="menu.show()"
  >
    <span class="header__menu-label">Menú</span>
    <span class="header__burger" aria-hidden="true"></span>
  </button>
</header>
