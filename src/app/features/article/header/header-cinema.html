@let d = data();
<!-- El header del sitio se vuelve transparente mientras está sobre la foto. -->
<header class="cinema scheme-dark" data-header-overlay>
  @if (d.cover; as cover) {
    <div class="cinema__media">
      <app-media
        [image]="cover.media"
        fill
        flush
        priority
        [sizes]="cover.sizes"
        [showCredit]="false"
      />
    </div>
  }
  <div class="cinema__veil" aria-hidden="true"></div>

  <div class="cinema__layout article-grid">
    <div class="cinema__lede">
      <app-article-kicker [section]="d.section" [format]="d.format" />
      <h1 id="article-title" class="cinema__title" appSplitText>{{ d.title }}</h1>
    </div>
    <p class="cinema__dek t-lead">{{ d.dek }}</p>
    <app-article-facts class="cinema__facts" [facts]="d.facts" [demo]="d.demo" />
    @if (d.cover; as cover) {
      <app-photo-credit
        class="cinema__credit photo-credit--keep photo-plate-md"
        [media]="cover.media"
      />
    }
  </div>
</header>
