# Solo para los tests: clave HMAC de prueba de la API (en local y en producción llega de un
# secreto de archivo, /run/secrets/cms.security.hmac-key). No es un secreto real.
cms.security.hmac-key=clave-hmac-de-pruebas-de-la-api-no-secreta-0000
# Todos los tests comparten la IP 127.0.0.1: el límite por IP (20 fallos / 15 min) se acumularía
# entre tests ajenos. Solo aquí se relaja ESE límite; los tests de la limitación de intentos
# (security.limits) usan los valores reales.
cms.security.limits.ip-failures=100000
